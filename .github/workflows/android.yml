
name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Find APK files
      id: find-apk
      run: |
        mkdir -p apk-output
        find . -type f -name "*.apk" -not -path "./.gradle/*" -exec cp {} apk-output/ \;

        if [ -z "$(find apk-output -type f -name '*.apk')" ]; then
          echo "No APK found!"
          exit 1
        fi

        echo "APK files found:"
        find apk-output -type f -name "*.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: apk-output/*.apk
